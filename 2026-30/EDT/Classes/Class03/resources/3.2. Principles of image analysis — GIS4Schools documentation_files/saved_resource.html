library(RStoolbox)
library(raster)
library(ggplot2)

## Load test image
data(lsat) 

## Collect training samples 
## First location is water, second is open agricultural vegetation
pts &lt;- data.frame(x = c(624720, 627480), y = c(-414690, -411090))
training_samples &lt;- extract(lsat, pts)
rownames(training_samples) &lt;- c("water", "vegetation")

## Calculate spectral angles
lsat_sam &lt;- sam(lsat, training_samples, angles = TRUE)

## Plot spectral angles (spectral signatures' similarity)
plot(lsat_sam)

## Classify based on minimum angle
lsat_sam &lt;- sam(lsat, training_samples, angles = FALSE)

## Show classification map
ggR(lsat_sam, forceCat = TRUE, geom_raster=TRUE) + 
        scale_fill_manual(values = c("blue", "green"), labels = c("water", "vegetation"))

## Show test image
ggRGB(lsat, stretch = "lin")</textarea>
